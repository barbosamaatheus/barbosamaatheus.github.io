explain_textual: As duas branches mudaram a mesma linha, então o git para e pede que alguém escolha. Chato, mas pelo menos é visível.
explain_clean: As mudanças estão em métodos diferentes que não compartilham estado. O git faz o merge e o programa faz o que as duas pessoas esperavam.
explain_semantic: O git faz esse merge sem nenhum aviso, mas a atribuição da branch da direita sobrescreve o desconto da branch da esquerda, e o cliente nunca recebe o desconto. Isso é uma interferência de overriding assignment, o tipo de conflito que minha pesquisa detecta com análise estática.

