score_text: "Semantic conflicts are the ones git can’t see: the merge looks fine, the tests might even pass, and the behavior is still wrong. My PhD is about merge tools that catch them before they reach production."
see_papers: Read my papers
play_again: Play again
back_to_lab: Back to the lab
explain_textual: Both branches changed the same line, so git stops and asks someone to choose. Annoying, but at least it’s visible.
explain_clean: The edits touch different methods that share no state. Git merges them and the program does what both developers expect.
explain_semantic: Git merges this without a warning, but the right branch’s assignment overwrites the left branch’s discount, so customers never get it. This is an overriding assignment interference, the kind of conflict my research detects with static analysis.

