# Languages
#   Create a section for each of your site's languages.
#   Documentation: https://docs.hugoblox.com/reference/language/
#
#   English is the default and lives in `content/`.
#   Portuguese lives in `content-pt/`, which only needs the pages you want to
#   translate: any page missing there is shown in English (see module.yaml).

# Default language
en:
  languageCode: en-us
  languageName: English
  weight: 1

pt:
  languageCode: pt-BR
  languageName: Português
  weight: 2
  title: Matheus Barbosa | Professor e Doutorando
  params:
    locale:
      date_format: '2 Jan 2006'
